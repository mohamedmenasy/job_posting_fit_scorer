[project]
name = "jobfit-backend"
version = "0.1.0"
description = "JobFit AI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "selectolax>=0.4.11",
    "sqlalchemy>=2",
    "typesafe-sdk==0.6.*",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real TypeSafe (needs TYPESAFE_API_KEY)",
    "live_http: fetches real job boards over the network",
]
addopts = "-m 'not live and not live_http'"
